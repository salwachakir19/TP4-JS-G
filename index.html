
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">


    <title>Gestion des commandes "Magasin de cosmétiques"</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container py-4">

        <h1 class="text-center mb-4">
            Gestion des commandes
        </h1>

        
        <div id="indicateurs" class="row mb-4">
        </div>

        <div class="row g-3 align-items-end mb-4">

            <div class="col-md-4">
                <label for="recherche" class="form-label">
                    Recherche
                </label>

                <input
                    type="text"
                    id="recherche"
                    class="form-control form-control-lg"
                    placeholder="Rechercher un client..."
                >
            </div>

            <div class="col-md-4">
                <label for="categorie" class="form-label">
                    Catégorie
                </label>

                <select
                    id="categorie"
                    class="form-select form-select-lg"
                >
                    <option value="all">Toutes les catégories</option>
                    <option value="Soins du visage">Soins du visage</option>
                    <option value="Soins du corps">Soins du corps</option>
                    <option value="Soins des cheveux">Soins des cheveux</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="statut" class="form-label">
                    Statut
                </label>

                <select
                    id="statut"
                    class="form-select form-select-lg"
                >
                    <option value="all">Tous les statuts</option>
                    <option value="Livree">Livree</option>
                    <option value="En attente">En attente</option>
                    <option value="Annulee">Annulee</option>
                </select>
            </div>

        </div>

  
        <div id="erreur" class="mb-3"></div>

        <h3 class="mb-3">Liste des commandes</h3>

        <div id="commandes"></div>

        <div id="details"></div>

    </div>

    <script type="module" src="js/app.js"></script>

</body>
</html>
